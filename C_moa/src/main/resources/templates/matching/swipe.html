<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Tinder - 매칭</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <style>
        /* 슈퍼라이크 애니메이션 */
        @keyframes flyOutUp {
            to {
                transform: translate(0, -1000px) rotate(0deg);
                opacity: 0;
            }
        }

        .fly-up {
            animation: flyOutUp 0.8s ease-out forwards;
        }

        /* [추가] 별 버튼 스타일 */
        .star-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            font-size: 2.5rem;
            color: #e9ecef;
            /* 비활성 색상 */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .star-btn:hover {
            color: #ffc107;
            /* 호버 시 노란색 */
            transform: scale(1.1) rotate(15deg);
        }

        .star-btn.active {
            color: #ffc107;
        }
    </style>
</head>

<body>


    <div th:replace="~{layout/header :: header(mode=${null})}"></div>

    <div class="card-container" id="cardContainer">

        <!-- 데이터가 없을 때 -->
        <div th:if="${#lists.isEmpty(jobPostings)}" class="text-center mt-5">
            <h2>새로운 공고가 없습니다. 😅</h2>
            <p>나중에 다시 확인해주세요.</p>
        </div>

        <!-- 데이터가 있을 때 -->
        <div th:unless="${#lists.isEmpty(jobPostings)}" class="tinder-card" id="currentCard"
            th:with="job=${jobPostings[0]}">

            <!-- Hidden ID (Job ID) -->
            <input type="hidden" id="targetId" th:value="${job.id}">
            <!-- Seeker supports Job ID as targetId -->

            <div class="card-face card-front">
                <!-- 이미지 (랜덤? 또는 기업 로고) -->
                <div class="card-img-top">
                    <!-- [추가] 슈퍼 라이크 버튼 (별 모양) -->
                    <!-- 인라인 이벤트 핸들러로 확실하게 동작 보장 -->
                    <div class="star-btn" onclick="confirmSuperLike(event)" onmousedown="event.stopPropagation()"
                        ontouchstart="event.stopPropagation()">
                        <i class="fas fa-star"></i>
                    </div>
                    <i class="fas fa-building"></i>
                    <!-- <img th:if="${job.recruiter.companyLogoUrl}" th:src="${job.recruiter.companyLogoUrl}" /> -->
                </div>
                <div class="card-info">
                    <!-- 회사명 클릭 시 상세 페이지 이동 -->
                    <!-- 회사명 (링크 제거됨) -->
                    <h2 class="fw-bold" th:text="${job.recruiter.companyName}">네이버 (Naver)</h2>

                    <h4 class="text-secondary mt-2" th:text="${job.title}">백엔드 엔지니어</h4>
                    <h5 class="text-success fw-bold mt-3">기술 스택: <span class="tagify-display"
                            th:attr="data-tags=${job.techStacks}"></span></h5>

                    <div class="mt-auto mb-2 d-flex flex-column align-items-center">
                        <p class="text-muted mb-2"><small>👇 아래 버튼을 클릭하여 상세 정보 확인</small></p>
                        <!-- 더 직관적인 버튼 추가 -->
                        <a th:href="@{/company/{id}(id=${job.recruiter.id})}"
                            class="btn btn-sm btn-outline-info rounded-pill">
                            <i class="fas fa-info-circle me-1"></i> 기업 인사이트 (면접팁/연봉)
                        </a>
                    </div>
                </div>
            </div>

            <div class="card-face card-back">
                <div class="d-flex flex-column justify-content-center flex-grow-1 w-100">
                    <div class="text-center mb-4">
                        <!-- [추가] 마감일 표시 -->
                        <div class="mb-2">
                            <span class="badge bg-danger">마감</span>
                            <small class="fw-bold text-dark"
                                th:text="${#temporals.format(job.endDate, 'yyyy-MM-dd HH:mm')}">2024-12-31 23:59</small>
                        </div>

                        <h6 class="text-secondary mb-1">상세 내용</h6>
                        <!-- 설명 -->
                        <div class="px-3" style="max-height: 100px; overflow-y:auto;" th:text="${job.description}">설명
                        </div>
                    </div>

                    <div class="mb-4 text-start px-2">
                        <h5 class="text-primary fw-bold mb-2"><i class="fas fa-thumbs-up me-2"></i>자격 요건</h5>
                        <div class="tagify-display" th:attr="data-tags=${job.requirements}">요건</div>
                    </div>

                    <div class="mb-4 text-start px-2" th:if="${job.preferences}">
                        <h5 class="text-success fw-bold mb-2"><i class="fas fa-plus-circle me-2"></i>우대 사항</h5>
                        <div class="tagify-display" th:attr="data-tags=${job.preferences}">우대사항</div>
                    </div>

                    <div class="text-start px-2">
                        <h5 class="text-info fw-bold mb-2"><i class="fas fa-info-circle me-2"></i>회사 소개</h5>
                        <div th:text="${job.recruiter.companyDesc}">회사 소개</div>
                    </div>
                </div>
                <p class="text-muted mt-auto mb-2 text-center"><small>👆 클릭하여 앞으로 돌아가기</small></p>
            </div>
        </div>
    </div>

    <!-- [복구] 기존 Footer 사용 -->
    <div th:replace="~{layout/footer :: footer('explore')}"></div>

    <script th:if="${!#lists.isEmpty(jobPostings)}">
        document.addEventListener("DOMContentLoaded", function () {
            const card = document.getElementById('currentCard');
            if (!card) return;

            let isDragging = false;
            let startX = 0;
            let startY = 0; // [복구] Y축 추가
            let currentX = 0;
            let currentY = 0; // [복구] Y축 추가
            let hasDragged = false;

            // [Note] 별 버튼 이벤트는 HTML 인라인 핸들러(onmousedown 등)로 처리함.

            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag);
            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('touchmove', moveDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            card.addEventListener('click', function (e) {
                if (hasDragged) { hasDragged = false; return; }
                // [안전장치] 혹시라도 버튼 클릭이 버블링되었다면 무시
                if (e.target.closest('.star-btn')) return;

                card.classList.toggle('is-flipped');
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (e.key === 'ArrowUp') triggerSwipe('UP', true); // SuperLike
                    else triggerSwipe(e.key === 'ArrowLeft' ? 'LEFT' : 'RIGHT');
                }
            });

            function startDrag(e) {
                isDragging = true; hasDragged = false;
                startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
                startY = (e.type === 'touchstart') ? e.touches[0].clientY : e.clientY; // [복구]
                card.style.transition = 'none';
            }

            function moveDrag(e) {
                if (!isDragging) return;
                const clientX = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
                const clientY = (e.type === 'touchmove') ? e.touches[0].clientY : e.clientY; // [복구]

                currentX = clientX - startX;
                currentY = clientY - startY; // [복구]

                if (Math.abs(currentX) > 5 || Math.abs(currentY) > 5) hasDragged = true;

                let rotate = currentX * 0.05;
                const isFlipped = card.classList.contains('is-flipped');

                // [복구] Y축 이동 포함 (슈퍼라이크 힌트)
                if (isFlipped) {
                    card.style.transform = `translate(${currentX}px, ${currentY}px) rotateY(180deg) rotate(${-rotate}deg)`;
                } else {
                    card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
                }
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = 'transform 0.3s ease-out';

                // [복구] 위로 스와이프 (슈퍼라이크) - 임계값 -100
                if (currentY < -100) {
                    triggerSwipe('UP', true);
                } else if (currentX > 150 || currentX < -150) {
                    triggerSwipe(currentX > 150 ? 'RIGHT' : 'LEFT');
                } else {
                    card.style.transform = card.classList.contains('is-flipped') ? 'rotateY(180deg)' : 'translate(0, 0)';
                }
                currentX = 0;
                currentY = 0;
            }
        });

        function confirmSuperLike(e) {
            console.log(">>> [DEBUG] Star Button Clicked! (Client Side)");
            e.stopPropagation(); // 이벤트 버블링 방지
            if (confirm("슈퍼 라이크(스카웃 제안)를 보내시겠습니까? 💎 100P가 소모됩니다.")) {
                triggerSwipe('UP', true); // 슈퍼 라이크 액션 트리거
            } else {
                // 취소 시 카드 원위치 (필요하다면)
                const card = document.getElementById('currentCard');
                if (card) {
                    card.style.transform = card.classList.contains('is-flipped') ? 'rotateY(180deg)' : 'translate(0, 0)';
                }
            }
        }

        function triggerSwipe(direction, isSuperLike = false) {
            const card = document.getElementById('currentCard');
            if (!card) return;

            // 슈퍼라이크면 위로 날리기 액션
            if (isSuperLike) {
                // confirmSuperLike 함수에서 이미 확인했으므로 여기서 다시 confirm하지 않음
                card.style.transform = ''; // [Fix] 인라인 스타일 제거하여 CSS 애니메이션 적용 보장
                card.classList.add('fly-up');
            } else {
                card.classList.add(direction === 'RIGHT' ? 'fly-right' : 'fly-left');
            }

            // API 호출
            const targetId = document.getElementById('targetId').value;
            // RIGHT면 좋아요(true), LEFT면 싫어요(false)
            // UP(SuperLike)도 좋아요(true)로 취급
            const isLike = (direction === 'RIGHT' || isSuperLike);

            // 500ms 후 처리 (애니메이션 완료 대기)
            setTimeout(() => {
                fetch('/propose', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `targetId=${targetId}&isLike=${isLike}&isSuperLike=${isSuperLike}`
                })
                    .then(response => response.text())
                    .then(result => {
                        if (result === 'point_shortage') {
                            alert("포인트가 부족합니다! (필요: 100P)");
                            window.location.reload();
                        } else {
                            window.location.reload();
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        window.location.reload();
                    });
            }, 500);
        }
    </script>

    <script>
        // Tagify JSON 파싱 (화면에 보기 좋게 표시)
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.tagify-display').forEach(function (element) {
                const jsonStr = element.getAttribute('data-tags');
                if (jsonStr && jsonStr.trim().startsWith('[')) {
                    try {
                        const tags = JSON.parse(jsonStr);
                        const text = tags.map(t => t.value).join(', ');
                        element.textContent = text || '없음';
                    } catch (e) {
                        element.textContent = jsonStr;
                    }
                } else {
                    element.textContent = jsonStr || '없음';
                }
            });
        });
    </script>

</body>

</html>
