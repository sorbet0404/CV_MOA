<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>기업 인사이트 - C-MOA</title>
    <!-- [수정] 공통 헤더 (mode='company-detail'로 설정) -->
    <th:block th:replace="~{layout/header :: header('company-detail')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .premium-content {
            position: relative;
            min-height: 200px;
        }

        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }

        .company-header {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .badge-soft-primary {
            background-color: #e6f6ff;
            color: #0084ff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 5px;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-5" style="max-width: 800px; padding-bottom: 100px;">

        <!-- [상단] 기본 정보 -->
        <div class="company-header shadow-sm d-flex align-items-center mb-4">
            <img th:src="${recruiter.companyLogoUrl}" class="rounded-circle border me-4"
                style="width: 100px; height: 100px; object-fit: cover;">
            <div>
                <h2 class="fw-bold mb-1" th:text="${recruiter.companyName}">회사 이름</h2>

                <!-- [수정] 산업군 (Tagify JSON 파싱 Display) -->
                <div class="d-flex flex-wrap mb-2 tagify-badge-display" th:attr="data-tags=${recruiter.industry}"></div>

                <div class="d-flex align-items-center">
                    <span class="text-warning me-1"><i class="fas fa-star"></i></span>
                    <span class="fw-bold" th:text="${recruiter.rating}">4.5</span>
                </div>
            </div>
        </div>

        <!-- [중단] 회사 소개 (무료) -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3"><i class="fas fa-building text-primary me-2"></i> 회사 소개</h5>
                <p class="text-secondary" th:text="${recruiter.companyDesc}">회사 소개 문구</p>
                <hr>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h6 class="fw-bold text-success"><i class="fas fa-thumbs-up me-1"></i> 장점</h6>
                        <p class="small text-muted" th:text="${recruiter.companyPros}">장점 내용</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <h6 class="fw-bold text-danger"><i class="fas fa-thumbs-down me-1"></i> 단점</h6>
                        <p class="small text-muted" th:text="${recruiter.companyCons}">단점 내용</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- [하단] 프리미엄 정보 (유료 - 면접 팁, 연봉 등) -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold m-0 text-dark">
                    <i class="fas fa-crown text-warning me-2"></i> 프리미엄 인사이트
                </h5>
            </div>
            <div class="card-body p-4 premium-content">

                <!-- 잠금 상태일 때 보이는 오버레이 -->
                <div class="blur-overlay" th:if="${!isUnlocked}">
                    <div class="text-center p-4 bg-white shadow rounded">
                        <h4 class="fw-bold mb-2">🔒 비공개 정보입니다</h4>
                        <p class="text-muted mb-4">
                            면접 기출 질문, 합격 꿀팁, 그리고<br>
                            솔직한 현직자 평가를 확인하세요!
                        </p>
                        <button class="btn btn-primary btn-lg rounded-pill px-5 fw-bold" onclick="unlockContent()">
                            <i class="fas fa-gem me-2"></i> 50P로 잠금 해제
                        </button>
                    </div>
                </div>

                <div th:if="${isUnlocked}">
                    <div class="mb-4">
                        <label class="fw-bold fs-5 mb-2 badge bg-info text-dark">💡 면접 꿀팁 & 기출 질문</label>
                        <div class="bg-light p-3 rounded" style="white-space: pre-wrap;"
                            th:text="${recruiter.interviewTips}">
                            면접 팁 내용이 나옵니다.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold fs-5 mb-2 badge bg-secondary">🏢 조직 문화 & 현직자 평가</label>
                        <div class="bg-light p-3 rounded" style="white-space: pre-wrap;"
                            th:text="${recruiter.companyCulture}">
                            조직 문화 내용이 나옵니다.
                        </div>
                    </div>

                    <div class="mb-0">
                        <label class="fw-bold fs-5 mb-2 badge bg-success">💰 연봉 정보</label>
                        <div class="fw-bold text-dark fs-5" th:text="${recruiter.salaryInfo}">
                            연봉 정보
                        </div>
                    </div>
                </div>

                <div th:if="${!isUnlocked}" style="filter: blur(5px); user-select: none;">
                    <!-- [DB 데이터 연동] 잠겨있을 때 보여줄 흐릿한 데이터 (하드코딩 제거) -->
                    <div class="mb-4">
                        <div class="bg-light p-3 rounded">
                            <!-- 실제 데이터의 앞부분만 가져오거나 전체를 보여주고 blur 처리 -->
                            <!-- 여기서는 실제 데이터의 길이에 비례하는 더미 텍스트를 생성하거나, 실제 텍스트를 그대로 출력하되 blur 처리 -->
                            <span th:text="${recruiter.interviewTips}"></span>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="bg-light p-3 rounded">
                            <span th:text="${recruiter.companyCulture}"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script th:inline="javascript">
        function unlockContent() {
            if (!confirm("50 포인트를 사용하여 정보를 확인하시겠습니까?")) return;

            const recruiterId = [[${ recruiter.id }]];

            fetch(`/company/${recruiterId}/unlock`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => response.text())
                .then(result => {
                    if (result === 'success') {
                        alert("잠금 해제되었습니다! 💎");
                        location.reload();
                    } else if (result === 'point_shortage') {
                        alert("포인트가 부족합니다! 😭\n(필요: 50P)");
                    } else if (result === 'login_required') {
                        alert("로그인이 필요합니다.");
                        location.href = '/login';
                    } else {
                        alert("오류가 발생했습니다.");
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("서버 통신 오류");
                });
        }

        // Tagify JSON 처리 스크립트
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll('.tagify-badge-display').forEach(function (element) {
                const jsonStr = element.getAttribute('data-tags');
                if (!jsonStr) return;

                try {
                    // Tagify JSON 문자열 파싱
                    // 예: [{"value":"IT"}, {"value":"서비스"}]
                    // 경우에 따라 단순 문자열일 수도 있음
                    let tags = [];
                    if (jsonStr.trim().startsWith('[')) {
                        tags = JSON.parse(jsonStr);
                    } else {
                        // 콤마로 구분된 문자열인 등 예외 처리
                        tags = [{ value: jsonStr }];
                    }

                    // 배지 생성
                    element.innerHTML = '';
                    tags.forEach(t => {
                        const span = document.createElement('span');
                        span.className = 'badge-soft-primary';
                        span.textContent = t.value;
                        element.appendChild(span);
                    });
                } catch (e) {
                    // 파싱 실패 시 그냥 텍스트로 노출
                    element.textContent = jsonStr;
                }
            });
        });
    </script>
</body>

</html>
