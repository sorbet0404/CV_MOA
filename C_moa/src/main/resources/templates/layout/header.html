<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="header(mode)">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top shadow-sm">
        <div class="container-fluid">

            <button class="btn btn-link text-dark me-2" onclick="toggleSidebar()"
                th:if="${mode != 'profile' and mode != 'jobs' and mode != 'company-detail'}"
                style="font-size: 1.5rem; text-decoration: none;">
                <i class="fas fa-bars"></i>
            </button>

            <a class="navbar-brand fw-bold"
                th:href="${session.user != null and session.user.role.name() == 'RECRUITER'} ? '/matching/recruiter' : '/matching'"
                style="color: #fd297b; font-size: 1.5rem;">
                <i class="fas fa-fire"></i> C-MOA
            </a>

            <div class="mx-auto"></div>

            <div class="d-flex align-items-center gap-2">

                <div class="d-flex align-items-center me-2" title="남은 세션 시간">
                    <i class="far fa-clock me-1 text-secondary"></i>
                    <span id="sessionTimer" class="badge bg-danger rounded-pill fs-6" style="width: 60px;">30:00</span>
                </div>

                <!-- [추가] 포인트 표시 (클릭 가능) -->
                <div id="pointDisplay" class="d-flex align-items-center me-2" title="보유 포인트/슈퍼라이크 사용"
                    th:if="${session.user != null}" style="cursor: pointer;">
                    <span class="badge bg-warning text-dark rounded-pill fs-6" style="min-width: 60px;">
                        <i class="fas fa-gem me-1"></i> <span th:text="${session.user.point} + ' P'">0 P</span>
                    </span>
                </div>

                <!-- [수정] 프로필 페이지 또는 상세 페이지인 경우: '돌아가기' 버튼 -->
                <a th:if="${mode == 'profile' or mode == 'company-detail'}"
                    th:href="${mode == 'company-detail' ? '/matching' : (session.user.role.name() == 'RECRUITER' ? '/matching/recruiter' : '/matching')}"
                    class="btn btn-outline-danger btn-sm fw-bold">
                    <i class="fas fa-sign-out-alt"></i> 돌아가기
                </a>

                <!-- [수정] 프로필 페이지가 아닌 경우: '내 프로필' 버튼 표시 -->
                <a th:if="${mode != 'profile' and mode != 'company-detail' and (session.user == null or session.user.role.name() == 'SEEKER')}"
                    href="/profile" class="btn btn-outline-secondary btn-sm fw-bold">
                    <i class="fas fa-user-edit"></i> 내 프로필
                </a>

                <!-- 채용공고 작성 페이지일 때의 별도 돌아가기 버튼 (유지) -->
                <a th:if="${session.user != null and session.user.role.name() == 'RECRUITER' and mode == 'jobs'}"
                    href="/matching/recruiter" class="btn btn-outline-secondary btn-sm fw-bold">
                    <i class="fas fa-arrow-left"></i> 돌아가기
                </a>

                <!-- 회사 정보 버튼: mode가 company-info가 아닐 때만 노출 -->
                <a th:if="${session.user != null and session.user.role.name() == 'RECRUITER' and (mode == null or (mode != 'jobs' and mode != 'company-info'))}"
                    href="/recruiters/company-info" class="btn btn-outline-info btn-sm fw-bold">
                    <i class="fas fa-building"></i> 회사 정보
                </a>

                <!-- 채용 공고 버튼: 항상 노출 (jobs 페이지 제외) -->
                <!-- 사용자가 matching/recruiter와 동일하게 + 모양을 원함 -->
                <a th:if="${session.user != null and session.user.role.name() == 'RECRUITER' and (mode == null or mode != 'jobs')}"
                    href="/jobs/list" class="btn btn-primary btn-sm fw-bold text-white border-0"
                    style="background: linear-gradient(to right, #fd297b, #ff655b);">
                    <i class="fas fa-plus-circle"></i> 채용 공고
                </a>

                <a href="/login" class="btn btn-sm btn-dark fw-bold">로그아웃</a>
            </div>
        </div>
    </nav>

    <div style="height: 70px;"></div>

    <!-- 사이드바 오버레이 -->
    <div id="sidebarOverlay" class="overlay" onclick="toggleSidebar()"
        th:if="${mode != 'profile' and mode != 'jobs' and mode != 'company-detail'}">
    </div>

    <!-- 메인 사이드바 -->
    <div id="mainSidebar" class="sidebar" th:if="${mode != 'profile' and mode != 'jobs' and mode != 'company-detail'}">
        <div class="sidebar-header">
            <span
                th:text="${session.user != null and session.user.role.name() == 'RECRUITER' ? '지원자 목록 👨‍💻' : '매칭된 기업 🏢'}">
                채팅 목록
            </span>
            <button class="btn-close" onclick="toggleSidebar()"></button>
        </div>

        <ul class="list-unstyled">
            <!-- chatRooms가 null일 수도 있으므로 안전하게 처리 -->
            <li th:if="${chatRooms == null or #lists.isEmpty(chatRooms)}" class="text-muted px-3 py-2">
                채팅방이 없습니다.
            </li>

            <li th:if="${chatRooms != null}" th:each="room : ${chatRooms}"
                class="chat-item d-flex align-items-center px-3 py-2"
                th:onclick="|location.href='@{/chat/room/{id}(id=${room.id})}'|" style="cursor:pointer;">
                <div class="me-2"><i class="fas fa-comments"></i></div>

                <div>
                    <div class="fw-bold" th:text="${room.match != null and room.match.jobPosting != null and room.match.jobPosting.title != null
                  ? room.match.jobPosting.title : '채팅방'}">채팅방</div>
                    <div class="text-muted small"
                        th:text="${room.match != null and room.match.jobPosting != null and room.match.jobPosting.recruiter != null
                  and room.match.jobPosting.recruiter.companyName != null
                  ? room.match.jobPosting.recruiter.companyName : (room.match != null and room.match.seeker != null ? room.match.seeker.nickname : '')}">
                    </div>
                </div>
            </li>
        </ul>
    </div>

    <script>
        // 사이드바 토글 함수 (전역 사용)
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('show');
            } else {
                console.error("Sidebar elements not found!");
            }
        }

        let time = 1800; // 30분
        const timerInterval = setInterval(function () {
            if (time > 0) {
                time--;
                let min = Math.floor(time / 60);
                let sec = time % 60;
                let secString = sec < 10 ? "0" + sec : sec;

                const timerElement = document.getElementById('sessionTimer');
                if (timerElement) {
                    timerElement.innerText = min + ":" + secString;
                }
            } else {
                clearInterval(timerInterval);
                alert("보안을 위해 세션이 만료되었습니다. 다시 로그인해주세요.");
                window.location.href = '/login';
            }
        }, 1000);
    </script>
</div>

</html>
