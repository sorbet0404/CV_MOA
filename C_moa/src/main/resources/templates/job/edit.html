<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>공고 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- 공고 페이지에서는 돌아가기 모드 헤더를 쓰고 싶다면 아래 1-1 참고 -->
    <div th:replace="~{layout/header :: header(mode='jobs')}"></div>

    <div class="container mt-5 pt-4" style="max-width: 720px;">
        <h3 class="fw-bold mb-3">공고 수정</h3>

        <form th:action="@{/jobs/{id}/edit(id=${posting.id})}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">제목</label>
                <input class="form-control" name="title" th:value="${posting.title}" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label fw-bold">공고 시작일</label>
                    <input type="date" name="startDate" class="form-control" th:value="${posting.startDate}" required>
                </div>
                <div class="col">
                    <label class="form-label fw-bold">공고 마감일</label>
                    <input type="datetime-local" name="endDate" class="form-control"
                        th:value="${#temporals.format(posting.endDate, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">설명</label>
                <textarea class="form-control" name="description" rows="4" th:text="${posting.description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">자격요건</label>
                <input id="requirements" class="form-control" name="requirements" th:value="${posting.requirements}">
            </div>

            <!-- [복구] 우대사항 (자동 추천 없음) -->
            <div class="mb-3">
                <label class="form-label fw-bold">우대사항</label>
                <input id="preferences" class="form-control" name="preferences">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">기술스택</label>
                <input id="techStacks" class="form-control" name="techStacks" th:value="${posting.techStacks}">
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <!-- 삭제 버튼 (좌측) -->
                <button type="button" class="btn btn-danger" onclick="deleteJob()">삭제</button>

                <!-- 저장/취소 버튼 (우측) -->
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-secondary" href="/jobs/list">취소</a>
                    <button class="btn btn-primary" type="submit">저장</button>
                </div>
            </div>
        </form>

        <!-- 삭제 폼 (숨김) -->
        <form id="deleteForm" th:action="@{/jobs/{id}/delete(id=${posting.id})}" method="post" style="display:none;">
        </form>

    </div>

    <!-- Tagify CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.polyfills.min.js"></script>


    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            // 삭제 확인 (전역 노출)
            window.deleteJob = function () {
                if (confirm('정말 삭제하시겠습니까? 관련 채팅방과 제안 내역도 모두 삭제됩니다.')) {
                    document.getElementById('deleteForm').submit();
                }
            };

            // 기술스택 Tagify
            var techInput = document.getElementById('techStacks');
            new Tagify(techInput, {
                delimiters: ",", // 쉼표로 태그 생성
                whitelist: ["Java", "Spring", "Spring Boot", "JPA", "MySQL", "React", "Vue", "JavaScript", "TypeScript", "Python", "Docker", "AWS", "Kubernetes"],
                dropdown: {
                    position: "input",
                    enabled: 0
                }
            });

            // 자격요건 Tagify
            var reqInput = document.getElementById('requirements');
            new Tagify(reqInput, {
                delimiters: ",",
                whitelist: ["신입가능", "경력직(1년 이상)", "경력(3년 이상)", "경력(5년 이상)", "경력(7년 이상)", "커뮤니케이션 능력", "문제해결 능력"],
                dropdown: {
                    position: "input",
                    enabled: 0
                }
            });

            // 우대사항 Tagify (자유 입력)
            var prefInput = document.getElementById('preferences');
            if (prefInput) {
                // [수정] 데이터 로딩 문제 방지를 위해 JS로 값 주입
                var prefValue = [[${ posting.preferences }]];
                prefInput.value = prefValue || "";

                new Tagify(prefInput); // 기본 설정 사용
            }
        });
    </script>
</body>

</html>
