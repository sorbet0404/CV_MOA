<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Tinder - 인재 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <style>
        .star-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            font-size: 2.5rem;
            color: #e9ecef;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .star-btn:hover {
            color: #ffc107;
            transform: scale(1.1) rotate(15deg);
        }

        /* 슈퍼라이크 애니메이션 */
        @keyframes flyOutUp {
            to {
                transform: translate(0, -1000px) rotate(0deg);
                opacity: 0;
            }
        }

        .fly-up {
            animation: flyOutUp 0.8s ease-out forwards;
        }
    </style>
</head>

<body>

    <div th:replace="~{layout/header :: header(mode=${null})}"></div>

    <div class="card-container" id="cardContainer">

        <!-- 데이터가 없을 때 -->
        <div th:if="${#lists.isEmpty(seekers)}" class="text-center mt-5">
            <h2>더 이상 추천할 인재가 없습니다. 😅</h2>
            <p>잠시 후 다시 시도해주세요.</p>
        </div>

        <!-- 데이터가 있을 때 -->
        <div th:unless="${#lists.isEmpty(seekers)}" class="tinder-card" id="currentCard" th:with="seeker=${seekers[0]}">

            <!-- Hidden ID -->
            <input type="hidden" id="targetId" th:value="${seeker.id}">

            <div class="card-face card-front">
                <div class="card-img-top recruiter-bg">
                    <!-- [추가] 슈퍼 라이크 버튼 (별 모양) -->
                    <div class="star-btn" onclick="confirmSuperLike(event)" onmousedown="event.stopPropagation()"
                        ontouchstart="event.stopPropagation()">
                        <i class="fas fa-star"></i>
                    </div>
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="card-info">
                    <h2 class="fw-bold" th:text="${seeker.nickname}">김지원 (Seeker)</h2>
                    <h4 class="text-secondary mt-2" th:text="${seeker.position + ' (' + seeker.careerYear + '년차)'}">풀스택
                        개발자 (3년차)</h4>
                    <h5 class="text-primary fw-bold mt-3">보유 기술: <span class="tagify-display"
                            th:attr="data-tags=${seeker.techStacks}"></span></h5>
                    <p class="text-muted mt-auto mb-2"><small>👆 클릭하여 상세 스펙 보기</small></p>
                </div>
            </div>

            <div class="card-face card-back recruiter-bg">
                <div class="d-flex flex-column justify-content-center flex-grow-1 w-100">
                    <div class="text-center mb-4">
                        <h6 class="text-secondary mb-1">자기 소개</h6>
                        <h5 class="fw-bold text-dark px-3" th:text="${seeker.bio}">안녕하세요.</h5>
                    </div>

                    <div class="mb-4 text-start px-2">
                        <h5 class="text-primary fw-bold mb-2"><i class="fas fa-code me-2"></i>기술 스택</h5>
                        <p class="tagify-display" th:attr="data-tags=${seeker.techStacks}">Java, Spring</p>
                    </div>

                    <!-- [추가] 이전 직장 (경력직만 표시) -->
                    <div class="mb-4 text-start px-2" th:if="${seeker.careerYear > 0}">
                        <h5 class="text-secondary fw-bold mb-2"><i class="fas fa-building me-2"></i>이전 직장</h5>
                        <!-- 값이 없으면 '없음'으로 나오도록 Tagify 스크립트가 처리함 (값이 '[]' or null이면 '없음') -->
                        <p class="tagify-display"
                            th:attr="data-tags=${seeker.previousCompany != null ? seeker.previousCompany : '[]'}"></p>
                    </div>

                    <div class="text-start px-2">
                        <h5 class="text-dark fw-bold mb-2"><i class="fas fa-link me-2"></i>포트폴리오</h5>
                        <a th:if="${seeker.portfolioUrl}" th:href="${seeker.portfolioUrl}" target="_blank"
                            class="text-truncate d-block">포트폴리오 보기</a>
                        <span th:unless="${seeker.portfolioUrl}" class="text-muted">없음</span>
                    </div>
                </div>
                <p class="text-muted mt-auto mb-2 text-center"><small>👆 클릭하여 앞으로 돌아가기</small></p>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer('explore')}"></div>

    <script th:if="${!#lists.isEmpty(seekers)}">

        document.addEventListener("DOMContentLoaded", function () {
            const card = document.getElementById('currentCard');
            if (!card) return;

            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            let hasDragged = false;

            // [Note] 별 버튼 이벤트는 HTML 인라인 핸들러로 처리.

            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag);
            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('touchmove', moveDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            card.addEventListener('click', function (e) {
                if (hasDragged) { hasDragged = false; return; }
                if (e.target.closest('.star-btn')) return; // 안전장치
                card.classList.toggle('is-flipped');
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    triggerSwipe(e.key === 'ArrowLeft' ? 'LEFT' : 'RIGHT');
                }
            });

            function startDrag(e) {
                isDragging = true; hasDragged = false;
                startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
                card.style.transition = 'none';
            }

            function moveDrag(e) {
                if (!isDragging) return;
                const clientX = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
                currentX = clientX - startX;
                if (Math.abs(currentX) > 5) hasDragged = true;

                let rotate = currentX * 0.05;
                const isFlipped = card.classList.contains('is-flipped');
                if (isFlipped) {
                    card.style.transform = `translateX(${currentX}px) rotateY(180deg) rotate(${-rotate}deg)`;
                } else {
                    card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
                }
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = 'transform 0.3s ease-out';
                if (currentX > 150 || currentX < -150) {
                    triggerSwipe(currentX > 150 ? 'RIGHT' : 'LEFT');
                } else {
                    card.style.transform = card.classList.contains('is-flipped') ? 'rotateY(180deg)' : 'translate(0, 0)';
                }
                currentX = 0;
            }
        });

        function confirmSuperLike(e) {
            console.log(">>> [DEBUG] Star Button Clicked! (Recruiter View)");
            e.stopPropagation();
            if (confirm("슈퍼 라이크(스카웃 제안)를 보내시겠습니까? 💎 100P가 소모됩니다.")) {
                const card = document.getElementById('currentCard'); // 카드 참조

                // 인라인 스타일 제거 및 애니메이션 클래스 추가
                card.style.transform = '';
                card.classList.add('fly-up');

                // 애니메이션 시작과 동시에 API 호출 로직 실행
                triggerSwipe('RIGHT', true);
            }
        }

        function triggerSwipe(direction, isSuperLike = false) {
            const card = document.getElementById('currentCard');
            if (!card) return;

            // 이미 fly-up이 아니라면 좌우 애니메이션 추가
            if (!isSuperLike) {
                card.classList.add(direction === 'RIGHT' ? 'fly-right' : 'fly-left');
            }

            // API 호출
            const targetId = document.getElementById('targetId').value;
            const isLike = (direction === 'RIGHT' || isSuperLike);

            // 500ms ~ 800ms 후 처리 (애니메이션 완료 대기)
            setTimeout(() => {
                fetch('/propose', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `targetId=${targetId}&isLike=${isLike}&isSuperLike=${isSuperLike}`
                })
                    .then(response => response.text())
                    .then(result => {
                        if (result === 'point_shortage') {
                            alert("포인트가 부족합니다! (필요: 100P)");
                            window.location.reload();
                        } else {
                            window.location.reload();
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        window.location.reload();
                    });

            }, 500);
        }
    </script>

    <script>
        // Tagify JSON 파싱 (화면에 보기 좋게 표시)
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.tagify-display').forEach(function (element) {
                const jsonStr = element.getAttribute('data-tags');
                if (jsonStr && jsonStr.trim().startsWith('[')) {
                    try {
                        const tags = JSON.parse(jsonStr);
                        const text = tags.map(t => t.value).join(', ');
                        element.textContent = text || '없음';
                    } catch (e) {
                        element.textContent = jsonStr;
                    }
                } else {
                    element.textContent = jsonStr || '없음';
                }
            });
        });
    </script>

</body>

</html>
