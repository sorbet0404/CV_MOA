<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>프로필 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet"> <!-- Main CSS 추가 -->

    <script th:inline="javascript">
        /* 서버 세션에서 유저 역할 가져오기 (없으면 기본값 SEEKER) */
        const userRole = "[[${session.user != null ? session.user.role : 'SEEKER'}]]";
        let isChanged = false;

        document.addEventListener("DOMContentLoaded", function () {
            // 입력 변경 감지
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('change', () => isChanged = true);
            });

            // 링크 이동 시 확인 로직
            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', function (e) {
                    if (isChanged && !confirm('아직 저장하지 못한 정보가 존재합니다. 돌아가시겠습니까?')) {
                        e.preventDefault();
                    }
                });
            });
        });

        // 돌아가기 버튼 (역할별 분기 처리)
        function goBack() {
            let targetUrl = (userRole === 'RECRUITER') ? '/matching/recruiter' : '/matching';

            if (isChanged) {
                if (confirm('아직 저장하지 못한 정보가 존재합니다. 돌아가시겠습니까?')) {
                    window.location.href = targetUrl;
                }
            } else {
                window.location.href = targetUrl;
            }
        }
    </script>
</head>

<body class="bg-light" style="overflow: auto; height: auto;">

    <div th:replace="~{layout/header :: header(mode='profile')}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4">내 정보 수정 ✏️</h3>

                        <!-- 이름 (수정 불가) -->
                        <div class="mb-3">
                            <label class="form-label text-muted">이름 (닉네임)</label>
                            <input type="text" class="form-control" id="nickname"
                                th:value="${seeker != null ? seeker.nickname : (session.user != null ? session.user.name : 'Unknown')}"
                                disabled>
                        </div>

                        <!-- 직무 -->
                        <div class="mb-3">
                            <label for="position" class="form-label fw-bold">직무</label>
                            <input type="text" class="form-control" id="position" placeholder="예: 백엔드 개발자"
                                th:value="${seeker != null ? seeker.position : ''}">
                        </div>

                        <!-- 경력 (드롭다운) -->
                        <div class="mb-3">
                            <label for="careerYear" class="form-label fw-bold">경력</label>
                            <select class="form-select" id="careerYear" onchange="toggleCompanyInput()">
                                <option value="0" th:selected="${seeker != null && seeker.careerYear == 0}">신입</option>
                                <option value="1" th:selected="${seeker != null && seeker.careerYear == 1}">경력 (1년 미만)
                                </option>
                                <option value="2"
                                    th:selected="${seeker != null && seeker.careerYear >= 2 && seeker.careerYear < 3}">
                                    경력 (1~3년 미만)</option>
                                <option value="3"
                                    th:selected="${seeker != null && seeker.careerYear >= 3 && seeker.careerYear < 5}">
                                    경력 (3~5년 미만)</option>
                                <option value="5" th:selected="${seeker != null && seeker.careerYear >= 5}">경력 (5년 이상)
                                </option>
                            </select>
                        </div>

                        <!-- 이전 직장 (조건부 노출) -->
                        <div class="mb-3" id="companyDiv" style="display: none;">
                            <label for="previousCompany" class="form-label fw-bold">이전 직장 (최근 3개)</label>
                            <input name="previousCompany" id="previousCompany" class="form-control"
                                placeholder="회사명 입력 후 엔터" th:value="${seeker != null ? seeker.previousCompany : ''}">
                        </div>

                        <!-- 기술 스택 (Auto Suggestion) -->
                        <div class="mb-3">
                            <label for="techStacks" class="form-label fw-bold">기술 스택</label>
                            <input name="techStacks" id="techStacks" class="form-control" placeholder="기술을 입력하고 엔터를 치세요"
                                th:value="${seeker != null ? seeker.techStacks : ''}">
                        </div>

                        <!-- 포트폴리오 URL -->
                        <div class="mb-3">
                            <label for="portfolio" class="form-label fw-bold">포트폴리오 URL</label>
                            <div class="input-group">
                                <span class="input-group-text">🔗</span>
                                <input type="url" class="form-control" id="portfolio"
                                    placeholder="https://github.com/..."
                                    th:value="${seeker != null ? seeker.portfolioUrl : ''}">
                            </div>
                        </div>

                        <!-- 상세 자기소개 (Bio) -->
                        <div class="mb-4">
                            <label for="bio" class="form-label fw-bold">상세 자기소개</label>
                            <textarea class="form-control" id="bio" rows="5" placeholder="경력과 강점을 적어주세요."
                                th:text="${seeker != null ? seeker.bio : ''}"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button onclick="saveProfile()" class="btn text-white fw-bold py-2"
                                style="background: linear-gradient(to right, #fd297b, #ff655b); border:none;">저장하기</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tagify CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.polyfills.min.js"></script>

    <script>
        function toggleCompanyInput() {
            const career = document.getElementById('careerYear').value;
            const div = document.getElementById('companyDiv');
            if (career == '0') {
                div.style.display = 'none';
            } else {
                div.style.display = 'block';
            }
        }

        // 초기 실행
        toggleCompanyInput();

        // Tagify 설정 (White List)
        var input = document.querySelector('input[name=techStacks]');
        var tagify = new Tagify(input, {
            whitelist: ["Java", "Spring", "Spring Boot", "JPA", "MySQL", "React", "Vue", "JavaScript", "TypeScript", "Python", "Docker", "AWS", "Kubernetes"],
            dropdown: {
                position: "input",
                enabled: 0 // always opens dropdown when input gets focus
            }
        });

        // [추가] 이전 직장 Tagify
        var inputCompany = document.querySelector('input[name=previousCompany]');
        var tagifyCompany = new Tagify(inputCompany, {
            maxTags: 3,
            placeholder: "회사명 입력 후 엔터",
            dropdown: {
                enabled: 0
            }
        });

        function saveProfile() {
            const data = {
                nickname: document.getElementById('nickname').value,
                position: document.getElementById('position').value,
                careerYear: parseInt(document.getElementById('careerYear').value),
                previousCompany: document.getElementById('previousCompany').value,
                techStacks: document.getElementById('techStacks').value, // Tagify 처리된 값
                bio: document.getElementById('bio').value,
                portfolioUrl: document.getElementById('portfolio').value
            };

            fetch('/api/users/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => {
                    if (res.ok) {
                        alert('프로필이 수정되었습니다.');
                        isChanged = false; // 변경 감지 플래그 해제
                        const targetUrl = (userRole === 'RECRUITER') ? '/matching/recruiter' : '/matching';
                        window.location.href = targetUrl;
                    } else {
                        return res.text().then(text => alert(text));
                    }
                });
        }
    </script>
</body>

</html>
