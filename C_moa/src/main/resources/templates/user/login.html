<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Job Tinder - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>

<body>

    <div class="login-card text-center">
        <h2 class="mb-4 fw-bold" style="color: #fd297b;">C-MOA</h2>
        <p class="text-muted mb-4">개발자를 위한 매칭 플랫폼</p>

        <div class="mb-3 text-start">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
        </div>

        <div class="mb-4 text-start">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" placeholder="비밀번호">
        </div>

        <button onclick="login()" class="btn btn-custom w-100 py-2 fs-5 mb-3">로그인</button>

        <div class="d-flex justify-content-between text-muted small">
            <a href="#" class="text-decoration-none text-secondary">비밀번호 찾기</a>
            <a href="/signup" class="text-decoration-none fw-bold" style="color: #fd297b;">회원가입</a>
        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 유효성 검사 (빈칸 체크)
            if (!email || !password) {
                alert("이메일과 비밀번호를 모두 입력해주세요.");
                return;
            }

            const data = {
                email: email,
                password: password
            };

            fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        // 성공 시 서버가 보낸 텍스트(Role)를 받음
                        return response.text();
                    } else {
                        throw new Error('로그인 실패');
                    }
                })
                .then(role => {
                    // role 변수에는 "SEEKER" 또는 "RECRUITER"가 들어있음

                    // 역할에 따라 안내 메시지 다르게 보여주기 (선택사항)
                    let userType = (role === 'RECRUITER') ? '채용 담당자' : '구직자';
                    alert("환영합니다! " + userType + " 모드로 접속합니다.");

                    // ★ [핵심] 역할에 따라 다른 페이지로 이동
                    if (role === 'RECRUITER') {
                        window.location.href = '/matching/recruiter'; // 채용 담당자용 페이지
                    } else {
                        window.location.href = '/matching'; // 구직자용 페이지 (기본)
                    }
                })
                .catch(error => {
                    alert("아이디 또는 비밀번호를 확인해주세요.");
                    console.error(error);
                });
        }
    </script>

</body>

</html>
